name: Release

permissions:
  contents: read

on:
  pull_request:
    types: [closed]

concurrency:
  group: firefox-store-release
  cancel-in-progress: false

jobs:
  submit:
    # Only run when the PR was merged into `main`.
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package and verify production archives
        run: npm run release:prepare:production

      - name: Verify live Dashboard import support
        run: node scripts/check-dashboard-capabilities.cjs

      - name: Submit Firefox archive
        env:
          FIREFOX_EXTENSION_ID: 'citizenhangar@sctr.space'
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          archive=".output/$(node -p "const pkg = require('./package.json'); pkg.name + '-' + pkg.version")"
          npx --no-install wxt submit --firefox-zip "${archive}-firefox.zip" --firefox-sources-zip "${archive}-sources.zip"
